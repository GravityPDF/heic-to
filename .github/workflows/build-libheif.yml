name: Build libheif

# Rebuilds libheif from the versions in scripts/libheif-versions.env and fails
# if the committed src/lib and dist files don't match, so every release is
# traceable to its sources. Pull requests run it, including the ones the release
# check (update-libheif.yml) opens; those runs wait for maintainer approval.
#
# Run it by hand with version overrides to produce files for a manual upgrade;
# the match check is skipped then, and the rebuilt files are uploaded.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      libheif_version:
        description: Override the libheif version (no leading v)
        required: false
      libde265_version:
        description: Override the libde265 version (no leading v)
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve versions
        env:
          LIBHEIF_OVERRIDE: ${{ inputs.libheif_version }}
          LIBDE265_OVERRIDE: ${{ inputs.libde265_version }}
        run: |
          source scripts/libheif-versions.env
          {
            echo "LIBHEIF_VERSION=${LIBHEIF_OVERRIDE:-$LIBHEIF_VERSION}"
            echo "LIBDE265_VERSION=${LIBDE265_OVERRIDE:-$LIBDE265_VERSION}"
            echo "EMSDK_VERSION=$EMSDK_VERSION"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      - run: npm ci

      - name: Build libheif.js
        id: build
        run: npm run build:libheif

      - name: Build dist
        run: npm run build

      - name: Smoke test
        run: node scripts/smoke-test.cjs

      - name: Committed files match the source build
        if: inputs.libheif_version == '' && inputs.libde265_version == ''
        run: git diff --stat --exit-code -- src/lib dist

      # Upload even when the match check fails, so a mismatch can be diffed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: heic-to-libheif-${{ env.LIBHEIF_VERSION }}
          path: |
            src/lib
            dist
